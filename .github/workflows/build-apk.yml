name: Build SoundAlert v0.2 APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 37 and build tools
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Download verified YAMNet model
        run: bash ./scripts/fetch-yamnet.sh

      - name: Remove legacy v0.1 sources
        run: |
          rm -f app/src/main/java/com/bridgeconn/soundalert/AppBus.kt
          rm -f app/src/main/java/com/bridgeconn/soundalert/audio/HeuristicSoundClassifier.kt
          rm -f app/src/main/java/com/bridgeconn/soundalert/ui/Theme.kt
          rm -f app/src/test/java/com/bridgeconn/soundalert/audio/HeuristicSoundClassifierTest.kt

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build phone and watch APKs
        run: gradle --no-daemon :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Verify APK signatures and alignment
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs wear/build/outputs/apk/debug/wear-debug.apk
          "$ZIPALIGN" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ZIPALIGN" -c -P 16 -v 4 wear/build/outputs/apk/debug/wear-debug.apk

      - name: Prepare phone APK
        run: |
          mkdir -p dist/phone
          cp app/build/outputs/apk/debug/app-debug.apk             dist/phone/SoundAlert-v0.2.0-INSTALL-ON-PHONE.apk
          cd dist/phone
          sha256sum *.apk > SoundAlert-v0.2.0-phone.sha256

      - name: Prepare watch APK
        run: |
          mkdir -p dist/watch
          cp wear/build/outputs/apk/debug/wear-debug.apk             dist/watch/SoundAlert-v0.2.0-INSTALL-ON-WEAR-OS-WATCH.apk
          cd dist/watch
          sha256sum *.apk > SoundAlert-v0.2.0-watch.sha256

      - name: Report phone APK size
        run: |
          PHONE_SIZE=$(stat -c%s dist/phone/SoundAlert-v0.2.0-INSTALL-ON-PHONE.apk)
          echo "Phone APK bytes: $PHONE_SIZE"
          if [ "$PHONE_SIZE" -gt 26214400 ]; then
            echo "::warning::Phone APK is above the preferred 25 MiB target."
          fi
          if [ "$PHONE_SIZE" -gt 41943040 ]; then
            echo "Phone APK exceeds the absolute 40 MiB ceiling."
            exit 1
          fi

      - name: Upload PHONE installer
        uses: actions/upload-artifact@v4
        with:
          name: INSTALL-ON-PHONE-SoundAlert-v0.2.0
          path: dist/phone/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload WATCH installer
        uses: actions/upload-artifact@v4
        with:
          name: INSTALL-ON-WATCH-SoundAlert-v0.2.0
          path: dist/watch/*
          if-no-files-found: error
          retention-days: 30
