name: Build SoundAlert v0.2 APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 37 and build tools
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Download verified YAMNet model
        run: ./scripts/fetch-yamnet.sh

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build phone and watch APKs
        run: gradle --no-daemon :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SoundAlert-v0.2.0-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk dist/SoundAlert-v0.2.0-wear.apk
          cd dist
          sha256sum *.apk > SoundAlert-v0.2.0.sha256
          PHONE_SIZE=$(stat -c%s SoundAlert-v0.2.0-phone.apk)
          echo "Phone APK bytes: $PHONE_SIZE"
          if [ "$PHONE_SIZE" -gt 26214400 ]; then
            echo "::warning::Phone APK is above the preferred 25 MiB ceiling; optimize before public release."
          fi
          if [ "$PHONE_SIZE" -gt 41943040 ]; then
            echo "Phone APK exceeds the absolute v0.2.0 ceiling of 40 MiB."
            exit 1
          fi

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: SoundAlert-v0.2.0-APKs
          path: dist/*
          if-no-files-found: error
          retention-days: 30
