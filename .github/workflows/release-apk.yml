name: Release SoundAlert APKs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 37 and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Download verified YAMNet model
        run: ./scripts/fetch-yamnet.sh

      - name: Test and build
        run: |
          gradle --no-daemon :app:testDebugUnitTest --stacktrace
          gradle --no-daemon :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SoundAlert-${GITHUB_REF_NAME}-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk dist/SoundAlert-${GITHUB_REF_NAME}-wear.apk
          cd dist
          sha256sum *.apk > SoundAlert-${GITHUB_REF_NAME}.sha256

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "SoundAlert $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
